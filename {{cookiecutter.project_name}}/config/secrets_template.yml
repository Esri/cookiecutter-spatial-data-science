# =============================================================================
# Secrets Configuration Template - {{ cookiecutter.project_name }}
# =============================================================================
# Copy this file to secrets.yml and fill in your actual values.
# NEVER commit secrets.yml to version control!
#
# Ensure secrets.yml is listed in .gitignore.
#
# Structure mirrors config.yml: secrets are resolved per-environment using the
# same three-layer merge (top-level → environments.default → environments.<env>)
# and then merged into the main config object.  Access secrets via:
#
#   from {{ cookiecutter.support_library }}.config import config
#   gis_url = config.esri.gis_url
#
# Only add a key to a named environment when it must differ from the default.
# =============================================================================

environments:

  default:
    esri:
      gis_url: "{{ cookiecutter.esri_web_gis_url }}"
      gis_profile: "{{ cookiecutter.esri_web_gis_profile }}"
      # sde_connection: "database/connections/my_database.sde"

  dev:
