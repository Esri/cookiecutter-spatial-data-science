# =============================================================================
# Secrets Configuration Template - {{ cookiecutter.project_name }}
# =============================================================================
# Copy this file to secrets.yml and fill in your actual values.
# NEVER commit secrets.yml to version control!
#
# Ensure secrets.yml is listed in .gitignore.
#
# Structure mirrors config.yml exactly: secrets use the same three-layer merge
#   top-level keys → environments.default → environments.<active-env>
# and are then merged into the main config object.  Access secrets via:
#
#   from {{ cookiecutter.support_library }}.config import config
#   gis_url = config.esri.gis_url
#
# The "default" section provides fallback values shared across all environments.
# Only add a key to a named environment when it must differ from the default.
#
# ABOUT THE EMPTY BRACES  {}
# ---------------------------
# Named environments with no overrides are written as  dev: {}  rather than
# just  dev:  because YAML parses a key whose body contains only comments as
# None (not an empty mapping), which would cause a runtime error.
#
#   dev: {}   ← correct: registers "dev" as an explicit empty mapping;
#               the loader will use all values from environments.default.
#
#   dev:      ← wrong when body is comments-only: YAML parses this as None.
#
# When to REMOVE the braces: when you add actual key-value overrides under the
# environment, remove {}  and place the keys on indented lines below instead:
#
#   dev:                    ← braces removed
#     esri:
#       sde_connection: "database/connections/dev_database.sde"
#
# When to ADD the braces: whenever an environment must exist (so the config
# loader recognises it as valid) but should inherit all values from default
# without any overrides.
# =============================================================================

environments:

  default: {} # if populating, remove the braces and add keys on indented lines below

    # example of a secret value that is shared across all environments
    # (e.g., a public API key or a password that is the same in dev / test / prod)
    # esri:
    #   gis_url: "https://www.arcgis.com"
    #   gis_username: "my_gis_username"
    #   gis_password: "P@$$w0rd"

  dev: {}  # inherits all defaults; add keys only when they must differ
    # esri:
    #   gis_url: "https://www.arcgis.com"
    #   gis_username: "my_gis_username"
    #   gis_password: "P@$$w0rd"

  test: {}
    # esri:
    #   gis_url: "https://www.arcgis.com"
    #   gis_username: "my_gis_username"
    #   gis_password: "P@$$w0rd"

  prod: {}
    # esri:
    #   gis_url: "https://www.arcgis.com"
    #   gis_username: "my_gis_username"
    #   gis_password: "P@$$w0rd"
